<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>詩歌資料庫</title>
    <link rel="stylesheet" href="/static/styles.css?v=1.3.0" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>詩歌資料庫</h1>
          <p id="stats">載入中...</p>
        </div>
        <div class="top-actions">
          <button id="newSongBtn" type="button">新增詩歌</button>
          <button id="adminToggleBtn" type="button">管理</button>
          <button id="refreshBtn" type="button">重新整理</button>
        </div>
      </header>

      <section class="search">
        <input id="searchInput" type="search" placeholder="搜尋歌名或歌詞，例如：現在活著的不再是我" />
        <button id="searchBtn" type="button">搜尋</button>
        <button id="reviewBtn" class="admin-only" type="button" hidden>待審核</button>
      </section>

      <section id="newSongPanel" class="new-song-panel" hidden>
        <div class="section-head">
          <h2>新增詩歌</h2>
          <button id="cancelNewSongBtn" type="button">取消</button>
        </div>
        <form id="newSongForm">
          <div class="form-grid">
            <label>
              歌名 <span class="required-mark">*</span>
              <input id="newSongTitle" name="title" maxlength="300" required />
            </label>
            <label>專輯（選填）<input id="newSongAlbum" name="album" maxlength="300" /></label>
            <label>作者（選填）<input id="newSongAuthor" name="author" maxlength="300" /></label>
            <label>作曲（選填）<input id="newSongComposer" name="composer" maxlength="300" /></label>
            <label class="wide-field">
              版權備註（選填）
              <input id="newSongCopyright" name="copyright_note" maxlength="1000" />
            </label>
          </div>
          <label>
            歌詞 <span class="required-mark">*</span>
            <textarea id="newSongLyrics" name="lyrics" maxlength="100000" rows="10" required></textarea>
          </label>
          <div class="form-actions">
            <button id="saveSongBtn" type="submit">儲存詩歌</button>
            <span id="newSongStatus" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="layout view-list">
        <aside class="song-list">
          <div class="list-head">
            <span id="listTitle">所有歌曲</span>
            <span id="countText"></span>
          </div>
          <div id="songs"></div>
          <div class="pager">
            <button id="prevBtn" type="button">上一頁</button>
            <button id="nextBtn" type="button">下一頁</button>
          </div>
        </aside>

        <article class="detail">
          <div class="detail-head">
            <div class="title-area">
              <button id="backBtn" class="back-btn" type="button">⬅ 返回</button>
              <h2 id="songTitle">選擇一首歌</h2>
            </div>
            <div class="detail-actions">
              <a id="pptLink" class="ppt-link generated-ppt-button" href="#" hidden>下載系統產生 PPT</a>
              <button id="customPptBtn" class="custom-ppt-button" type="button" hidden>下載自訂 PPT</button>
              <button id="togglePptUploadBtn" class="upload-ppt-button" type="button" hidden>上傳 PPTX</button>
              <button id="deleteSongBtn" class="danger-button" type="button" hidden>刪除歌曲</button>
            </div>
          </div>
          <section id="pptUploadPanel" class="ppt-upload-panel" hidden>
            <div class="section-head">
              <div>
                <h3>自訂 PPTX 版本</h3>
                <p class="muted">上傳後可選擇覆蓋標準下載，或另存成新的版本。</p>
              </div>
            </div>
            <form id="pptUploadForm" hidden>
              <div class="form-grid">
                <label>
                  版本名稱 <span class="required-mark">*</span>
                  <input id="pptVersionName" maxlength="100" value="自訂版" required />
                </label>
                <label>
                  PPTX 檔案 <span class="required-mark">*</span>
                  <input id="pptFile" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" required />
                </label>
              </div>
              <div class="form-actions">
                <button id="uploadPptBtn" type="submit">開始上傳</button>
                <button id="cancelPptUploadBtn" type="button">取消</button>
                <span id="pptUploadStatus" role="status" aria-live="polite"></span>
              </div>
            </form>
            <div id="pptUploadConflict" class="upload-conflict" hidden>
              <strong>這首歌已有 PPTX</strong>
              <p id="pptConflictMessage"></p>
              <div class="form-actions">
                <button id="overwritePptBtn" type="button">覆蓋標準下載</button>
                <button id="newPptVersionBtn" type="button">另存新版本</button>
                <button id="cancelPptConflictBtn" type="button">取消</button>
              </div>
            </div>
          </section>
          <div id="customPptModal" class="ppt-modal" hidden>
            <div class="ppt-modal-backdrop" data-close-custom-ppt></div>
            <section class="ppt-modal-card" role="dialog" aria-modal="true" aria-labelledby="customPptModalTitle">
              <div class="section-head">
                <div>
                  <h3 id="customPptModalTitle">選擇自定義 PPT</h3>
                  <p class="muted">請選擇要下載的自定義版本。</p>
                </div>
                <button id="closeCustomPptModalBtn" type="button">關閉</button>
              </div>
              <div id="customPptOptions" class="ppt-version-options"></div>
            </section>
          </div>
          <pre id="lyrics">你可以搜尋歌詞片段或歌名。</pre>
          <div id="reviewPanel" class="review-panel" hidden></div>
        </article>
      </section>
    </main>
    <script src="/static/app.js?v=1.3.1"></script>
  </body>
</html>
