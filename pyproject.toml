[project]
name = "songs-data"
version = "0.1.0"
description = "Local hymn/song database, crawler, search API, and PPT generator MVP."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "lxml>=5.3.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "python-pptx>=1.0.2",
  "rapidfuzz>=3.9.7",
  "sqlalchemy>=2.0.35",
  "typer>=0.12.5",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.8",
]

[project.scripts]
songs = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
